apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployforge-api
  labels:
    app.kubernetes.io/name: deployforge
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: deployforge
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: deployforge
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: deployforge-controller
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.api.port }}
              name: http
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "{{ .Values.api.port }}"
            - name: BASE_DOMAIN
              value: {{ .Values.global.domain | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: deployforge-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: deployforge-secrets
                  key: REDIS_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: deployforge-secrets
                  key: JWT_SECRET
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: deployforge-secrets
                  key: ENCRYPTION_KEY
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
