{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: deployforge-manager-role
rules:
  # Namespaces
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch", "create", "delete", "patch"]

  # Pods, Services, Secrets, ResourceQuotas, LimitRanges
  - apiGroups: [""]
    resources: ["pods", "services", "secrets", "resourcequotas", "limitranges"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # Deployments
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/status", "replicasets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # Ingresses and NetworkPolicies
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # Autoscaling (HPA v2)
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: deployforge-manager-binding
subjects:
  - kind: ServiceAccount
    name: deployforge-controller
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: deployforge-manager-role
  apiGroup: rbac.authorization.k8s.io
{{- end }}
