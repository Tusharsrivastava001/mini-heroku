name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Lint, typecheck, test, build, and chart validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate --schema=apps/api/prisma/schema.prisma

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Validate Helm chart
        run: |
          helm lint infra/helm/deployforge
          helm template deployforge infra/helm/deployforge --namespace deployforge

  secret-scan:
    name: Scan repository history for verified secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

  image-security:
    name: Build and scan ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            dockerfile: apps/api/Dockerfile
          - image: worker
            dockerfile: apps/worker/Dockerfile
          - image: dashboard
            dockerfile: apps/dashboard/Dockerfile
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          tags: deployforge/${{ matrix.image }}:${{ github.sha }}
          load: true

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: deployforge/${{ matrix.image }}:${{ github.sha }}
          format: table
          severity: CRITICAL
          vuln-type: os,library
          ignore-unfixed: true
          exit-code: "1"

  publish-images:
    name: Publish immutable images
    needs: [quality, secret-scan, image-security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            dockerfile: apps/api/Dockerfile
          - image: worker
            dockerfile: apps/worker/Dockerfile
          - image: dashboard
            dockerfile: apps/dashboard/Dockerfile
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize image namespace
        id: image
        shell: bash
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.image.outputs.prefix }}/${{ matrix.image }}:${{ github.sha }}

  update-gitops:
    name: Update chart image references for ArgoCD
    needs: publish-images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pin chart images to this workflow revision
        run: node scripts/update-chart-images.mjs "$GITHUB_REPOSITORY" "$GITHUB_SHA"

      - name: Commit GitOps image references
        run: |
          if git diff --quiet -- infra/helm/deployforge/values.yaml; then
            echo "Chart already points at this image revision."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add infra/helm/deployforge/values.yaml
          git commit -m "chore(gitops): deploy ${GITHUB_SHA}"
          git push
