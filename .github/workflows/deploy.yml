name: GitOps Configuration

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "infra/helm/**"
      - "infra/argocd/**"

permissions:
  contents: read

jobs:
  validate-gitops:
    name: Validate Helm and ArgoCD configuration
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Validate chart
        run: |
          helm lint infra/helm/deployforge
          helm template deployforge infra/helm/deployforge --namespace deployforge

      - name: Parse ArgoCD manifest
        run: ruby -e 'require "yaml"; abort "Expected one ArgoCD Application" unless YAML.load_file(ARGV.fetch(0))["kind"] == "Application"' infra/argocd/application.yaml
